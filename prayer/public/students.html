<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="ps.svg" type="image/svg+xml">
    <title>Student Prayer Request — PENSA TTU</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1a8a;
            --primary-light: #1a2fb0;
            --accent: #f5e100;
            --bg: #f0f2ff;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-light: #5a5a7a;
            --border: #d0d4e8;
            --success: #10b981;
            --success-bg: #d1fae5;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #050d4a 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 0.02em;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            opacity: 0.8;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(10, 26, 138, 0.1);
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .alert-success {
            background: var(--success-bg);
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: var(--danger-bg);
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1.5rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .request-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(10, 26, 138, 0.1);
            border: 1px solid var(--border);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .request-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-category {
            background: rgba(10, 26, 138, 0.08);
            color: var(--primary);
        }

        .badge-status {
            background: var(--success-bg);
            color: #065f46;
        }

        .badge-status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .request-date {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .request-text {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .request-actions {
            margin-top: 1.25rem;
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-prayed {
            background: var(--success);
            color: white;
        }

        .btn-prayed:hover {
            background: #059669;
        }

        .btn-back {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            text-decoration: none;
        }

        .btn-back:hover {
            background: var(--primary);
            color: white;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            text-decoration: none;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .login-card {
            max-width: 420px;
            margin: 3rem auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(10, 26, 138, 0.15);
            border: 1px solid var(--border);
            text-align: center;
        }

        .login-card h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .login-card input[type="password"]:focus {
            border-color: var(--primary);
        }

        .login-card button {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-card button:hover {
            background: var(--primary-light);
        }

        .header-actions {
            margin-top: 1rem;
        }

        .btn-logout {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.25);
        }

        .footer-actions {
            margin-top: 2rem;
            text-align: center;
        }

        @media (max-width: 640px) {
            header h1 { font-size: 2rem; }
            .request-header { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <h1>OPERATION <span>PAGA</span></h1>
        <p>Student Prayer Requests</p>
        <div class="header-actions" id="headerActions" style="display:none;">
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Login View -->
        <div class="login-card" id="loginView">
            <h2>Admin Login</h2>
            <p>Please enter the password to view student prayer requests.</p>
            <div class="alert alert-error" id="loginError" style="text-align: left; margin-bottom: 1rem; display:none;"></div>
            <form id="loginForm" onsubmit="return login(event)">
                <input type="password" name="login_password" placeholder="Password" required autofocus>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- Admin View -->
        <div id="adminView" style="display:none;">
            <div class="alert alert-success" id="successAlert" style="display:none;"></div>
            <div class="alert alert-error" id="errorAlert" style="display:none;"></div>

            <div class="stats" id="stats"></div>
            <div id="requestList"></div>

            <div class="footer-actions">
                <a href="/operation-paga" class="btn btn-back">← Back to Submission Page</a>
            </div>
        </div>
    </div>

<script>
    const TOKEN_KEY = 'pensa_prayer_admin_token';
    const USER_STATUS = 'Student';

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    function authHeaders() {
        const t = getToken();
        return t ? { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` } : { 'Content-Type': 'application/json' };
    }

    const CATEGORY_LABELS = {
        healing: '🙏 Healing & Health',
        guidance: '🧭 Guidance & Wisdom',
        academics: '📚 Academics & Exams',
        family: '👨‍👩‍👧‍👦 Family & Relationships',
        career: '💼 Career & Finances',
        spiritual: '✝️ Spiritual Growth & Guidance',
        campus: '🎓 Campus Life & Fellowship',
        thanks: '🙌 Thanksgiving & Praise',
        other: '✨ Other Requests'
    };

    function categoryLabel(c) { return CATEGORY_LABELS[c] || (c.charAt(0).toUpperCase() + c.slice(1)); }

    function formatDate(date) {
        if (!date) return '—';
        const d = new Date(date.replace(' ', 'T'));
        if (isNaN(d)) return '—';
        return d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function show(elId) { document.getElementById(elId).style.display = 'block'; }
    function hide(elId) { document.getElementById(elId).style.display = 'none'; }

    async function login(e) {
        e.preventDefault();
        const password = document.querySelector('input[name="login_password"]').value;
        const errBox = document.getElementById('loginError');
        errBox.style.display = 'none';
        try {
            const res = await fetch('/api/prayers/student/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (!res.ok) {
                errBox.textContent = data.error || 'Login failed.';
                errBox.style.display = 'block';
                return false;
            }
            setToken(data.token);
            showAdmin();
        } catch (err) {
            errBox.textContent = 'Network error: ' + err.message;
            errBox.style.display = 'block';
        }
        return false;
    }

    function logout() {
        clearToken();
        hide('adminView');
        show('loginView');
        document.querySelector('input[name="login_password"]').value = '';
    }

    async function showAdmin() {
        hide('loginView');
        show('adminView');
        document.getElementById('headerActions').style.display = 'block';
        await loadRequests();
    }

    function flash(elId, msg) {
        const el = document.getElementById(elId);
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function loadRequests() {
        try {
            const [statsRes, listRes] = await Promise.all([
                fetch(`/api/prayers/stats?userStatus=${USER_STATUS}`, { headers: authHeaders() }),
                fetch(`/api/prayers?userStatus=${USER_STATUS}&page=1`, { headers: authHeaders() })
            ]);

            if (statsRes.status === 401 || listRes.status === 401) {
                clearToken();
                hide('adminView');
                show('loginView');
                return;
            }

            const stats = await statsRes.json();
            const list = await listRes.json();

            renderStats(stats);
            renderRequests(list.requests || []);
        } catch (err) {
            flash('errorAlert', 'Could not load student prayer requests.');
        }
    }

    function renderStats(stats) {
        document.getElementById('stats').innerHTML = `
            <div class="stat-card"><div class="stat-value">${stats.total}</div><div class="stat-label">Total Requests</div></div>
            <div class="stat-card"><div class="stat-value">${stats.pending}</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-value">${stats.prayed}</div><div class="stat-label">Prayed</div></div>
        `;
    }

    function renderRequests(requests) {
        const list = document.getElementById('requestList');
        if (!requests.length) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <h2>No Student Requests Yet</h2>
                    <p>Student prayer submissions will appear here once they are received.</p>
                </div>`;
            return;
        }
        list.innerHTML = requests.map((r) => `
            <div class="request-card">
                <div class="request-header">
                    <div class="request-meta">
                        <span class="badge badge-category">${escapeHtml(categoryLabel(r.category))}</span>
                        <span class="badge badge-status ${r.status === 'prayed' ? '' : 'pending'}">
                            ${r.status === 'prayed' ? '✓ Prayed' : '⏳ Pending'}
                        </span>
                    </div>
                    <div class="request-date">${escapeHtml(formatDate(r.submitted_at))}</div>
                </div>
                <div class="request-text">${escapeHtml(r.prayer_text)}</div>
                <div class="request-actions">
                    ${r.status !== 'prayed' ? `<button class="btn btn-prayed" onclick="markPrayed(${r.id})">🙏 Mark as Prayed</button>` : ''}
                    <button class="btn btn-delete" onclick="deleteRequest(${r.id})">🗑 Delete</button>
                </div>
            </div>
        `).join('');
    }

    async function markPrayed(id) {
        try {
            const res = await fetch(`/api/prayers/${id}/pray?userStatus=${USER_STATUS}`, {
                method: 'POST',
                headers: authHeaders()
            });
            if (!res.ok) throw new Error('Failed');
            flash('successAlert', 'Request marked as prayed.');
            await loadRequests();
        } catch (err) {
            flash('errorAlert', 'Could not update request.');
        }
    }

    async function deleteRequest(id) {
        if (!confirm('Are you sure you want to delete this request?')) return;
        try {
            const res = await fetch(`/api/prayers/${id}?userStatus=${USER_STATUS}`, {
                method: 'DELETE',
                headers: authHeaders()
            });
            if (!res.ok) throw new Error('Failed');
            flash('successAlert', 'Request deleted.');
            await loadRequests();
        } catch (err) {
            flash('errorAlert', 'Could not delete request.');
        }
    }

    // On load: if a valid token exists, go straight to admin view
    (async function init() {
        const token = getToken();
        if (!token) return;
        try {
            const res = await fetch('/api/prayers/student/me', { headers: authHeaders() });
            if (res.ok) {
                await showAdmin();
            } else {
                clearToken();
            }
        } catch (err) {
            clearToken();
        }
    })();
</script>
</body>
</html>
