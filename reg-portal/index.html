<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13357e" />
    <meta name="description" content="PENSA TTU Member Registration Portal" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/pns.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pns.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pns.png" />
    <link rel="apple-touch-icon" href="/pns.png" />
    <title>PENSA TTU — Registration Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Camood&display=swap" rel="stylesheet" />
    <script>
      // Self-healing: if an older cached bundle fails with 404/chunk error,
      // unregister all service workers, clear caches, and reload once.
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        var src = (e && e.filename) || '';
        if (
          msg.includes('chunk') ||
          msg.includes('dynamically imported') ||
          msg.includes('Failed to fetch') ||
          src.includes('/assets/')
        ) {
          var hasTried = sessionStorage.getItem('pensa_sw_healed');
          if (!hasTried) {
            sessionStorage.setItem('pensa_sw_healed', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
            setTimeout(function () {
              window.location.reload();
            }, 300);
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#13357e;background:#f8f9fa;">
        <img src="/pns.png" alt="PENSA" style="width:72px;height:72px;margin-bottom:16px;" onerror="this.style.display='none'" />
        <div style="font-weight:700;font-size:1.15rem;letter-spacing:0.5px;">PENSA TTU REGISTRATION</div>
        <div style="color:#6c757d;font-size:0.9rem;margin-top:8px;">Loading registration portal...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
