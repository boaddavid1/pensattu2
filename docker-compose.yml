services:
  mysql:
    image: mysql:8.0
    container_name: grace_harbor_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: grace_harbor
    ports:
      - "3306:3306"
    volumes:
      - grace_harbor_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  grace_harbor_data:
